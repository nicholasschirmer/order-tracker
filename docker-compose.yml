services:
  backend:
    build: ./backend
    image: order-tracker-api
    environment:
      ConnectionStrings__Orders: "Data Source=/data/orders.db"
    volumes:
      - orders-data:/data
    # Uncomment to reach the API directly on the host as well:
    # ports:
    #   - "5080:8080"

  frontend:
    build: ./frontend
    image: order-tracker-web
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:8080
    ports:
      - "8080:80"

volumes:
  orders-data:
